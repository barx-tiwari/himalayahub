<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d3f94" />
    <title>HimalayaHub — Learn • Explore • Discover Nepal</title>
    <meta name="description" content="HimalayaHub is a modern platform for learning, Nepal travel discovery, live news, sports, weather, markets and useful student tools." />
    <meta name="application-name" content="HimalayaHub" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HimalayaHub" />
    <meta property="og:title" content="HimalayaHub — Learn • Explore • Discover Nepal" />
    <meta property="og:description" content="Explore Nepal's destinations, learn technology, practise typing and follow live news, sports, weather and markets — in one place." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HimalayaHub logo above a Himalayan ridge with the tagline Learn, Explore, Discover" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HimalayaHub — Learn • Explore • Discover Nepal" />
    <meta name="twitter:description" content="Learning, Nepal travel discovery, live news, sports, weather, markets and student tools." />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Hero photo (Wikimedia Commons thumbnail) starts downloading before the app boots. -->
    <link rel="preload" as="image" fetchpriority="high"
      imagesrcset="https://commons.wikimedia.org/wiki/Special:FilePath/Everest%2C_Nuptse%2C_Khumbu_Glacier%2C_Nepal%2C_Himalayas.jpg?width=500 500w, https://commons.wikimedia.org/wiki/Special:FilePath/Everest%2C_Nuptse%2C_Khumbu_Glacier%2C_Nepal%2C_Himalayas.jpg?width=960 960w, https://commons.wikimedia.org/wiki/Special:FilePath/Everest%2C_Nuptse%2C_Khumbu_Glacier%2C_Nepal%2C_Himalayas.jpg?width=1280 1280w, https://commons.wikimedia.org/wiki/Special:FilePath/Everest%2C_Nuptse%2C_Khumbu_Glacier%2C_Nepal%2C_Himalayas.jpg?width=1920 1920w"
      imagesizes="100vw" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&family=Mukta:wght@400;600&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var raw = localStorage.getItem('himalayahub:theme') || localStorage.getItem('learnhub:theme');
        var t = raw ? JSON.parse(raw) : null;
        if (t !== 'light' && t !== 'dark') t = null;
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Shown until React mounts; replaced automatically. -->
      <div class="boot-splash" role="status" aria-label="Loading HimalayaHub">
        <svg viewBox="0 0 32 32" width="56" height="56" aria-hidden="true"><defs><linearGradient id="bs" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3f94"/><stop offset="1" stop-color="#0a8fb0"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#bs)"/><path d="M3.5 25 L11.5 13.5 L15 18 L19.5 10.5 L28.5 25 Z" fill="#fff"/><path d="M19.5 10.5 L24.6 5.6" stroke="#f2b33d" stroke-width="1.4" stroke-linecap="round"/><circle cx="24.8" cy="5.4" r="1.9" fill="#f2b33d"/></svg>
        <span>HIMALAYAHUB</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
